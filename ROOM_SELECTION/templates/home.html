{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <div class="neu-card p-5">
            <h1 class="display-4 mb-3 text-primary">Discover Knowledge</h1>
            <p class="lead mb-4">AI-Powered Search & Recommendations</p>
            
            <form action="/search" method="GET">
                <div class="d-flex gap-3">
                    <input type="text" name="q" class="neu-input" placeholder="Search (e.g. 'Intro to ML' or 'Steve Jobs')..." required>
                    <button class="neu-btn" type="submit"><i class="bi bi-search"></i></button>
                </div>
            </form>
            <p class="mt-3 text-muted small">Try searching with typos like "Pythen"!</p>
        </div>
    </div>
</div>

<div class="row mt-5">
    <div class="col-md-12 text-center">
        <h3 class="mb-4">Recommended for You</h3>
    </div>
    <div class="col-md-4"><div class="neu-card mb-3 text-center"><h5>Python Coding</h5><small>Education</small></div></div>
    <div class="col-md-4"><div class="neu-card mb-3 text-center"><h5>Steve Jobs</h5><small>Biography</small></div></div>
    <div class="col-md-4"><div class="neu-card mb-3 text-center"><h5>Modern Arts</h5><small>Arts</small></div></div>
</div>
{% endblock %}
