{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="neu-card p-5 text-center">
            <h2 class="mb-4 text-primary"><i class="bi bi-shield-lock-fill"></i> Admin Portal</h2>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">Admin ID</label>
                    <input type="text" name="username" class="neu-input" placeholder="Enter ID..." required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" name="password" class="neu-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="neu-btn w-100">Unlock Dashboard</button>
            </form>
            <div class="mt-3">
                <a href="/" class="text-muted small text-decoration-none">← Back to Library</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
